    excerpt: "Public and private AI valuations assume enterprise ROI arrives on a software-adoption timeline. Everything happening inside client organizations right now says the real timeline is longer — and the gap is where the next repricing comes from.",
    body: `
      <p>Price an AI company today and you are, whether the model admits it or not, making a bet about speed: how fast enterprises will adopt, how fast that adoption turns into measurable productivity or revenue, and how fast that value flows back as revenue to the company being priced. Compress that timeline in your head by eighteen months and a valuation looks justified. Stretch it back out to what's actually happening inside client organizations, and the same valuation looks like it's pricing in a future that keeps receding.</p>
      <p>That gap — between the adoption curve Wall Street and venture markets are underwriting and the adoption curve actually playing out inside large organizations — is the single most important thing happening in AI valuations right now, and it's getting almost no attention relative to the next model release.</p>
      <h3>The curve being priced in</h3>
      <p>Valuation multiples on AI-exposed companies, foundation model labs included, largely assume something close to a software adoption curve: a sharp S-curve where enterprise spend ramps within a few budget cycles, because the product is "just" a subscription or an API call away from being live. That assumption made sense for SaaS, where the main friction was procurement and integration was often weeks, not years.</p>
      <p>It does not hold for the category of AI deployments that actually move an income statement. Those deployments sit inside workflows that touch regulated data, legacy systems, and human processes that were never designed to be rewired quickly — which is a very different adoption curve from "the team signed a license and logged in."</p>

      <h3>Why the realization timeline keeps slipping</h3>
      <ul>
        <li><strong>The pilot-to-production gap is real and it is structural.</strong> The same dynamics that strand GenAI pilots before they scale — unowned post-pilot operations, unresolved data governance, no budgeted change management — don't just delay a single project. Multiplied across a portfolio of initiatives, they delay the entire enterprise P&L impact investors are underwriting.</li>
        <li><strong>Procurement and risk review cycles haven't gotten faster.</strong> Security review, model risk assessment, and legal sign-off for anything touching customer or regulated data routinely take two to four quarters at large institutions — a cycle time that hasn't compressed just because the underlying technology improved.</li>
        <li><strong>Attribution is genuinely hard.</strong> Even where AI tools are in use and clearly helping, isolating the dollar impact from everything else moving in a large organization at the same time is a measurement problem most finance functions aren't yet equipped to solve cleanly — which means the ROI exists but is slow to show up in a form a board will cite.</li>
        <li><strong>The organization has to change shape, not just tooling.</strong> Realizing the productivity gain often requires redesigning a role or a process, not just handing the existing role a new tool — and headcount and process redesign move on an HR and change-management clock, not a product-release clock.</li>
      </ul>
      <h3>The historical pattern this rhymes with</h3>
      <p>Every prior general-purpose technology wave — the PC, the internet, cloud, mobile — shows the same shape: capital markets price in the value years before operational reality delivers it, there's a painful repricing in the middle when the gap becomes undeniable, and the value does eventually show up, on a longer and lumpier timeline than the first round of enthusiasm assumed. Cloud computing is the closest analogue: real, large, durable value — delivered on a timeline measured in a decade of enterprise migration, not the few years early forecasts assumed.</p>
      <p>Nothing about the current AI cycle suggests enterprises have gotten structurally faster at digesting transformative technology since the last cycle. If anything, the surface area is larger — AI touches more processes, more data categories, and more regulatory exposure than cloud migration did, which argues for a longer digestion period, not a shorter one.</p>
      <h3>What this means for how AI investment should be underwritten</h3>

        <li><strong>Separate "the technology works" from "we can realize the value" as distinct risks.</strong> Capital markets are mostly underwriting the first risk, which is genuinely resolving quickly. The second risk — organizational, procedural, human — is resolving slowly, and it's the one that determines whether the revenue shows up on schedule.</li>
      </ul>
      <p>None of this is an argument that the technology isn't real or that the long-run value isn't there — the prior essays on this site are an argument that it clearly is. It's an argument that the market's clock and the client organization's clock are running at different speeds, and the companies and investors who price that gap honestly are going to look a great deal smarter in three years than the ones who didn't.</p>

  {
    slug: 'why-genai-pilots-never-scale',

    excerpt: 'Dozens of GenAI pilots launch inside large organizations every quarter. Almost none of them survive contact with production. The reason is rarely the model.',
    body: `
      <p>Walk into almost any large enterprise today and you'll find a GenAI pilot somewhere — a chatbot prototype in procurement, a summarization tool in legal, a copilot bolted onto a CRM. Walk back in eighteen months later, and most of them are gone. Not because the technology failed, but because the pilot was never built to survive outside the sandbox it was born in.</p>
      <p>After sitting through enough of these programs, a pattern becomes hard to ignore: the pilots that die were almost always evaluated on the wrong question. The question asked was "can this work?" The question that actually determines survival is "can this run without the three people who built it?"</p>
      <h3>The data debt shows up late, not early</h3>
      <p>A pilot usually runs on a curated, cleaned, hand-picked slice of data — the version of reality the project team had time to prepare. Production doesn't offer that courtesy. The moment a tool touches live, messy, inconsistently-governed data across business units, accuracy drops, trust drops with it, and the business sponsor who championed the pilot quietly stops mentioning it in steering committee updates.</p>
      <p>This is not an AI problem. It is the same data quality and governance debt that has sunk BI programs and analytics transformations for twenty years, wearing a new costume.</p>
      <h3>Nobody budgeted for the boring half</h3>
      <p>The flashy half of a GenAI build — prompt design, model selection, a slick demo — gets the budget and the executive attention. The boring half — access controls, audit logging, fallback behavior when the model is wrong, a process for who fixes it when it breaks — gets an afterthought line item, if it gets one at all. Scaling is almost entirely made of the boring half.</p>
      <blockquote>A pilot proves a capability exists. Scaling proves an organization can be trusted to operate it.</blockquote>
      <h3>Ownership gets fuzzy exactly when it matters</h3>
      <p>During the pilot, ownership is obvious: the project team owns it. Post-pilot, it needs a permanent home — a product owner, a budget line, an SLA, a team that gets paged when it breaks at 2am. That home rarely exists on day one, and building it is a harder conversation than building the model ever was, because it touches headcount, cost centers, and who gets blamed when something goes wrong.</p>
      <h3>What tends to separate the pilots that scale</h3>
      <ul>
        <li><strong>They name an owner before they name a model.</strong> A permanent, funded owner for the capability is secured before the pilot even starts, not negotiated after it succeeds.</li>
        <li><strong>They test on the data nobody wants to clean.</strong> The pilot is deliberately run against the messiest, most representative slice of real data available — not the easy subset — so the accuracy numbers mean something.</li>
        <li><strong>They design for the failure case, not just the happy path.</strong> What the tool does when it's wrong, uncertain, or down is specified with as much care as what it does when it's right.</li>

    excerpt: 'The anxiety in consulting right now is pointed at the wrong target. The real risk to a career isn\'t a model — it\'s a colleague who figured out leverage six months before you did.',
    body: `
      <p>Every few months a new wave of "AI will replace consultants" takes a lap around the industry. It's the wrong fear, aimed at the wrong thing. The honest version of the statement is narrower and more uncomfortable: AI will replace the parts of consulting that were never really the job in the first place.</p>
      <h3>What was never the job</h3>
      <p>A huge amount of junior and mid-level consulting time has historically gone into work that looks like expertise but is actually just friction — reformatting the same findings into a different template for the third stakeholder, manually reconciling three versions of a spreadsheet, writing the first pass of a slide nobody will remember, summarizing a 90-minute call for people who were on the call. None of that work builds judgment. It was tolerated because there was no cheaper way to get it done.</p>
      <p>That excuse is gone. A model can produce the first-draft slide, the clean reconciliation, the call summary, in minutes, at a quality that used to take a staffed-up team an evening. The work that remains after you strip that out is the work that was always the actual value a consultant provides: judgment under ambiguity, the ability to read a room and know what the client isn't saying, the credibility to tell a CEO something they don't want to hear.</p>
      <blockquote>AI is very good at producing an answer. It is not good at knowing which question the client actually needs answered.</blockquote>
      <h3>Where the leverage is real right now</h3>
      <ul>
        <li><strong>Research synthesis.</strong> Turning twenty interview transcripts or a stack of annual reports into a structured first view, in hours instead of days — leaving the consultant's time for deciding what the synthesis means.</li>
        <li><strong>Scenario and sensitivity modeling.</strong> Running the fifth and sixth "what if" variant that would never have made it into a time-boxed engagement before, because it was too expensive to build by hand.</li>
        <li><strong>Drafting against a point of view.</strong> Producing a competent first draft once a human has supplied the actual argument — the difference between AI as ghostwriter and AI as author.</li>
        <li><strong>Pressure-testing your own thinking.</strong> Using a model as a deliberately difficult sparring partner to find the holes in a recommendation before a client does.</li>
      </ul>
      <h3>Where it quietly fails</h3>
      <p>It fails at anything that requires actually being in the room: reading that the CFO's objection isn't about the number, it's about not having been consulted; knowing that a recommendation is technically correct but will get the sponsor fired if proposed this quarter; building the kind of trust that makes a client call you before a crisis instead of after one. No model does that. No model is being asked to.</p>
      <h3>The actual career risk</h3>
      <p>The risk isn't a model taking a consultant's seat. It's a peer who used the hours a model freed up to go deeper on the client relationship, think harder about the recommendation, and show up to the meeting having already stress-tested the idea three times — while someone else spent those same hours formatting a deck by hand, out of habit. Leverage compounds quietly. By the time it's visible in a promotion cycle, the gap is already old.</p>

  {
    slug: 'new-consulting-pricing-model-ai',
    title: 'The New Consulting Pricing Model in an AI World',

    image: 'https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=1600&q=80',
    excerpt: 'Time-and-materials pricing was always a proxy for value, not value itself. AI is the thing finally forcing the industry to notice the difference.',
    body: `
      <p>The consulting industry has billed by the hour for so long that it's easy to forget the hour was always a stand-in for something else — a rough proxy for effort, which was itself a rough proxy for value delivered. It worked reasonably well when effort and value were loosely correlated: harder problems took more hours, more hours meant more invoice, client and firm both accepted the approximation.</p>
      <p>AI breaks the correlation in a very specific way. It doesn't make the hard problems easier to solve — the judgment calls, the stakeholder navigation, the actual thinking are untouched. It makes the supporting labor around those problems dramatically cheaper: the research, the modeling, the drafting, the formatting. When the supporting labor collapses toward zero cost but the client's perceived value of the outcome doesn't move, billing by the hour starts to actively punish efficiency. A firm that uses AI well delivers the same outcome in a third of the time — and bills a third as much, for doing better work.</p>
      <blockquote>Every hour a firm saves with AI under a time-and-materials contract is an hour of revenue a firm also loses.</blockquote>
      <h3>Why this incentive problem is already visible</h3>
      <p>Clients are not naive about this. Procurement functions that have spent a decade negotiating rate cards are starting to ask, reasonably, why a deliverable that visibly took a fraction of the staffing it used to still carries the old price tag. That question is uncomfortable for firms still staffed and priced around 2015-era effort assumptions, and it is only going to get louder.</p>
      <h3>The models that are actually emerging</h3>
      <ul>
        <li><strong>Outcome-based pricing.</strong> Price tied to a defined result — cost saved, revenue unlocked, a system successfully migrated — rather than hours logged. This has existed at the edges of consulting for years; AI-driven efficiency is pushing it toward the center, because it's now the only structure that rewards a firm for being fast instead of penalizing it.</li>
        <li><strong>Subscription / retainer advisory.</strong> A fixed monthly fee for ongoing access to a team plus its AI-augmented tooling, instead of a one-off project — closer to how software is sold than how consulting traditionally has been.</li>
        <li><strong>Tiered deliverable pricing.</strong> A flat price per deliverable type (a market sizing, a competitive teardown, a first-draft operating model) calibrated to the new, AI-assisted cost of producing it — transparent, and far easier for procurement to benchmark.</li>
        <li><strong>Hybrid models.</strong> A reduced baseline fee for the AI-accelerated commodity work, with premium pricing reserved explicitly for the judgment-heavy layer — strategy calls, stakeholder alignment, final recommendations — priced as what it actually is: scarce expertise, not time.</li>

      <h3>What doesn't go away</h3>
      <p>None of this means consulting fees fall to zero, because the thing clients are actually paying for was never purely the hours — it was the judgment, the accountability, and the willingness to put a firm's name behind a hard recommendation. That part doesn't get commoditized by a language model. What AI does is force an honest separation between the part of the fee that was paying for labor and the part that was paying for expertise, and firms that haven't made that separation explicit in their own pricing are going to have it made for them, by a client who's done the math first.</p>

      <p>Most conversations about AI and consulting stay at the strategy-deck altitude — "transformative," "paradigm shift," "every workflow will change." Useful for a keynote, not very useful for a delivery lead deciding where to actually point a team's time this quarter. A more honest map looks smaller, and more boring, than the keynote version.</p>

        <li><strong>First-pass research synthesis.</strong> Collapsing a stack of interview transcripts, annual reports, or regulatory filings into a structured summary is close to a solved problem now. The gain isn't that the summary is perfect — it's that a human reviewing and correcting a draft is faster than a human building one from a blank page.</li>
        <li><strong>Data cleaning and reconciliation grunt work.</strong> Matching inconsistent naming conventions across three client systems, flagging outliers, standardizing formats — the unglamorous 60% of an analytics workstream that used to eat junior analyst time with no learning value attached to it.</li>
        <li><strong>First-draft narrative.</strong> Once a senior team member has the actual point of view, turning that point of view into a competent first-draft slide or memo is a task AI does well, freeing the human for the edit pass where the real thinking happens.</li>
        <li><strong>Scenario generation at scale.</strong> Building the eighth sensitivity case on a financial model — the one that would have been cut from scope for time — becomes cheap enough to just include.</li>
        <li><strong>Internal QA and consistency checks.</strong> Catching the slide that contradicts the number three pages earlier, or the assumption that silently changed between two model tabs, is something models are quietly excellent at and humans are quietly bad at, because humans get tired and models don't.</li>
      </ul>
      <h3>Where it's mostly noise today</h3>
      <ul>
        <li><strong>Final client recommendations.</strong> Not because a model can't generate plausible-sounding advice, but because the value of a recommendation is inseparable from the accountability behind it, and a client isn't paying to be told something — they're paying for someone qualified to stand behind it.</li>
        <li><strong>Stakeholder navigation.</strong> Knowing that the real blocker to a project isn't the technical design but a turf dispute between two VPs is read from tone, history, and relationships a model doesn't have access to.</li>
        <li><strong>Novel, ambiguous problem framing.</strong> When a client doesn't yet know what question they're actually asking, the valuable work is the back-and-forth that finds the real problem — a process that depends on context a model wasn't given and often can't be given, because the client hasn't articulated it yet either.</li>
        <li><strong>Anything where being wrong is expensive and hard to detect.</strong> Regulatory interpretation, high-stakes financial assumptions, anything where a confidently-wrong answer looks identical to a correct one until it's too late — these need a human in the loop whose job is specifically to be skeptical, not a tool optimized to sound fluent.</li>
      </ul>
      <blockquote>The useful dividing line isn't "hard versus easy" — it's "checkable versus not." AI earns its keep fastest on work where a human can verify the output quickly. It's riskiest exactly where verification is slow, expensive, or itself requires the expertise being replaced.</blockquote>
      <p>The practical takeaway for a delivery lead isn't a philosophy — it's a staffing decision. Point AI at the checkable, high-volume, low-judgment layer of an engagement, protect the hours that frees up, and reinvest them in the parts of the work that were always the actual reason a client hired a person instead of buying a report off a shelf.</p>
    `
  }
];

function navigate(hash) { window.location.hash = hash; }

let carouselIndex = 0;
let carouselTimer = null;

function renderCarousel() {
  const slides = POSTS.slice(0, 5);
  return `
    <div class="carousel" id="carousel" onmouseenter="pauseCarousel()" onmouseleave="resumeCarousel()">
      <div class="carousel-track" id="carousel-track">
        ${slides.map(p => `
          <a class="carousel-slide" href="#/post/${p.slug}" onclick="navigate('#/post/${p.slug}')" style="background-image:linear-gradient(to top, rgba(10,12,11,0.8) 0%, rgba(10,12,11,0.1) 55%, rgba(10,12,11,0.3) 100%), url('${p.image}');">
            <div class="carousel-slide-content">
              <div class="post-meta">
                ${p.tags.map(t => `<span class="tag" style="background:rgba(255,255,255,0.2);color:#fff;">${t}</span>`).join('')}
              </div>
              <h2>${p.title}</h2>
            </div>
          </a>
        `).join('')}
      </div>
      <button class="carousel-arrow carousel-prev" onclick="goToSlide(carouselIndex-1)" aria-label="Previous slide">&#8249;</button>
      <button class="carousel-arrow carousel-next" onclick="goToSlide(carouselIndex+1)" aria-label="Next slide">&#8250;</button>
      <div class="carousel-dots">
        ${slides.map((_, i) => `<button class="carousel-dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})" aria-label="Go to slide ${i + 1}"></button>`).join('')}
      </div>
    </div>
  `;
}

function goToSlide(i) {
  const track = document.getElementById('carousel-track');
  if (!track) return;
  const total = track.children.length;
  carouselIndex = (i + total) % total;
  track.style.transform = `translateX(-${carouselIndex * 100}%)`;
  document.querySelectorAll('.carousel-dot').forEach((d, idx) => d.classList.toggle('active', idx === carouselIndex));
}

function startCarousel() {
  clearInterval(carouselTimer);
  carouselTimer = setInterval(() => goToSlide(carouselIndex + 1), 5000);
}

function pauseCarousel() { clearInterval(carouselTimer); }
function resumeCarousel() { startCarousel(); }

function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

function initials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase();
}

function renderList() {
  document.getElementById('app').innerHTML = `
    ${renderCarousel()}
    <div class="hero">
      <h1>Notes on AI in consulting</h1>
      <p>Short, practical essays on where AI actually changes consulting delivery, pricing, and careers — written from inside client work, not from a vendor deck.</p>
    </div>
    <div class="post-list">
      ${POSTS.map(p => `
        <a class="post-card" href="#/post/${p.slug}" onclick="navigate('#/post/${p.slug}')">
          <div class="post-meta">
            ${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}
            <span class="dot"></span>
            <span>${fmtDate(p.date)}</span>
            <span class="dot"></span>
            <span>${p.readTime}</span>
          </div>
          <h2>${p.title}</h2>
          <p class="excerpt">${p.excerpt}</p>
          <span class="read-more">Read the post &rarr;</span>
        </a>
      `).join('')}
    </div>
  `;
  carouselIndex = 0;
  startCarousel();
}

function renderPost(slug) {
  clearInterval(carouselTimer);
  const post = POSTS.find(p => p.slug === slug);
  const app = document.getElementById('app');
  if (!post) {
    app.innerHTML = `
      <div style="padding:60px 0;text-align:center;">
        <h2 style="margin-bottom:12px;">Post not found</h2>
        <a class="back-link" href="#/" onclick="navigate('#/')">&larr; Back to all posts</a>
      </div>`;
    return;
  }
  const others = POSTS.filter(p => p.slug !== slug).slice(0, 2);
  app.innerHTML = `
    <a class="back-link" href="#/" onclick="navigate('#/')">&larr; All posts</a>
    <article class="post">
      <div class="post-meta">
        ${post.tags.map(t => `<span class="tag">${t}</span>`).join('')}
        <span class="dot"></span>
        <span>${fmtDate(post.date)}</span>
        <span class="dot"></span>
        <span>${post.readTime}</span>
      </div>
      <h1>${post.title}</h1>
      <p class="excerpt-lead">${post.excerpt}</p>
      <div class="body">${post.body}</div>
      <div class="byline">
        <div class="avatar">${initials('Ravi Verma')}</div>
        <div><strong>Ravi Verma</strong> &nbsp;·&nbsp; Writes about AI, delivery, and the consulting business model</div>
      </div>
      ${others.length ? `
        <div class="more-posts">
          <h4>More from Beyond the Deck</h4>
          <div class="post-list">
            ${others.map(p => `
              <a class="post-card" href="#/post/${p.slug}" onclick="navigate('#/post/${p.slug}')">
                <div class="post-meta">
                  ${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                  <span class="dot"></span>
                  <span>${p.readTime}</span>
                </div>
                <h2>${p.title}</h2>
                <p class="excerpt">${p.excerpt}</p>
              </a>
            `).join('')}
          </div>
        </div>` : ''}
    </article>
  `;
  window.scrollTo(0, 0);
}

function router() {
  const hash = window.location.hash || '#/';
  const postMatch = hash.match(/^#\/post\/(.+)$/);
  if (postMatch) {
    renderPost(decodeURIComponent(postMatch[1]));
  } else {
    renderList();
  }
}

window.addEventListener('hashchange', router);
router();
</script>
</body>
</html>
